# Build the LED Panel web editor and attach zip to releases (or as artifact if run manually)
name: Build web editor

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # required for gh release upload

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-editor/package-lock.json

      - name: Install and build
        run: |
          cd web-editor
          npm ci
          npm run build:ha

      - name: Create zip
        run: |
          cd web-editor/dist
          zip -r ../../led-panel-editor.zip .

      - name: Upload to release
        if: github.event_name == 'release'
        run: |
          gh release upload "${{ github.event.release.tag_name }}" led-panel-editor.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: led-panel-editor
          path: led-panel-editor.zip
